[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Routers are imported after app/middleware setup to avoid circular imports.
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
