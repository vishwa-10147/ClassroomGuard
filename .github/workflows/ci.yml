name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Lint backend
        run: ruff check backend/

      - name: Type check backend
        run: mypy backend/app/ --ignore-missing-imports

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: classroomguard
          POSTGRES_PASSWORD: classroomguard_dev
          POSTGRES_DB: classroomguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://classroomguard:classroomguard_dev@localhost:5432/classroomguard
          JWT_SECRET: ci-test-secret
        run: cd backend && alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://classroomguard:classroomguard_dev@localhost:5432/classroomguard
          JWT_SECRET: ci-test-secret
        run: cd backend && python -m pytest tests/ -v --tb=short
