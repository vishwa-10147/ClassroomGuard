name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend/

      - name: Type check backend
        run: mypy --config-file backend/pyproject.toml backend/app/ --ignore-missing-imports

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: classroomguard
          POSTGRES_PASSWORD: classroomguard_dev
          POSTGRES_DB: classroomguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r backend/requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://classroomguard:classroomguard_dev@localhost:5432/classroomguard
          JWT_SECRET: ci-test-secret
        run: python -m backend.scripts.migrate

      - name: Seed test data and start API
        env:
          DATABASE_URL: postgresql+asyncpg://classroomguard:classroomguard_dev@localhost:5432/classroomguard
          JWT_SECRET: ci-test-secret
          USE_REDIS: "false"
          RATE_LIMIT_ENABLED: "false"
          AI_SERVICE_TOKEN: ci-ai-service-token-0123456789abcdef
        run: |
          python -m backend.seed_users
          python -m backend.seed_data
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/api/v1/auth/me && break; sleep 2; done

      - name: Run tests
        env:
          TEST_BASE_URL: http://127.0.0.1:8000
          TEST_AI_SERVICE_TOKEN: ci-ai-service-token-0123456789abcdef
        run: cd backend && python -m pytest tests/ -v --tb=short

      - name: Show API log on failure
        if: failure()
        run: cat api.log

      - name: Run AI rules tests
        run: |
          pip install numpy pytest
          cd ai && python -m pytest tests/ -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps for testing
        run: npm ci
      - name: Run frontend tests
        run: npx jest src
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests (Vite dev server -> API started above)
        run: npx playwright test

  build-docker:
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t classroomguard-backend backend
      - name: Build frontend image
        run: docker build -f Dockerfile -t classroomguard-frontend .
      - name: Build AI image
        run: docker build -f ai/Dockerfile -t classroomguard-ai ai
