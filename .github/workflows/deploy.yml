name: Deploy

# Builds the three images, pushes them to Amazon ECR and rolls them out on the EC2 host
# through AWS Systems Manager (no SSH keys in GitHub). Setup: docs/DEPLOY_AWS.md
#
# Repository variables: AWS_REGION, AWS_ROLE_ARN, ECR_REGISTRY, EC2_INSTANCE_ID
# (the deploy jobs are skipped until AWS_ROLE_ARN is configured)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for the AWS role
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: Dockerfile
          - name: ai
            context: ai
            dockerfile: ai/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/classroomguard-${{ matrix.name }}:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/classroomguard-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll out on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "classroomguard ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/classroomguard",
              "git fetch --quiet origin main && git checkout --quiet ${{ github.sha }}",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}",
              "export IMAGE_PREFIX=${{ vars.ECR_REGISTRY }}/classroomguard IMAGE_TAG=${{ github.sha }}",
              "docker compose -f docker-compose.yml -f docker-compose.aws.yml pull",
              "docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --remove-orphans",
              "docker image prune -f"
            ]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text)
          test "$STATUS" = "Success"
