name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t classroomguard-backend:latest -f backend/Dockerfile .

      - name: Build frontend image
        run: docker build -t classroomguard-frontend:latest -f Dockerfile .

