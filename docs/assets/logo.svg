<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">ClassroomGuard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBE7FF"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0B1530"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- shield -->
  <path d="M64 16 L100 30 V60 C100 84 85 102 64 112 C43 102 28 84 28 60 V30 Z" fill="url(#shield)"/>

  <!-- detection box corners -->
  <g fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 46 V38 H50"/>
    <path d="M78 38 H86 V46"/>
    <path d="M86 74 V82 H78"/>
    <path d="M50 82 H42 V74"/>
  </g>

  <!-- camera lens -->
  <circle cx="64" cy="60" r="17" fill="url(#lens)"/>
  <circle cx="64" cy="60" r="17" fill="none" stroke="#0B1530" stroke-width="2.5"/>
  <circle cx="64" cy="60" r="7" fill="#0B1530"/>
  <circle cx="58.5" cy="54.5" r="3.5" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- live indicator -->
  <circle cx="86" cy="96" r="7" fill="#22C55E" stroke="#FFFFFF" stroke-width="3"/>
</svg>
