# Classroom Guard - Cheating Detection Configuration
# RTX 4070 8GB | 2 Cameras | YOLO26m + Pose
# Upgraded from YOLOv8m → YOLO26m (NMS-free, end-to-end, ~43% faster CPU)

# === CAMERA SETTINGS ===
# Using local sample videos (27 classroom videos in sample_videos/)
# To use a webcam, replace source with an integer: 0 = default cam
cameras:
  - id: 0
    name: "Room 306-B Camera 5"
    source: "sample_videos/306-B-5.mp4"
    resolution: [1920, 1080]
    fps: 30
  - id: 1
    name: "Room 306-B Main"
    source: "sample_videos/306-B.mp4"
    resolution: [1920, 1080]
    fps: 30

# === MODEL SETTINGS ===
models:
  detection:
    weights: "models/yolo26m_custom.pt"    # YOLO26n custom trained
    fallback_weights: "yolo26m.pt"
    confidence: 0.15                        # LOW: phones in classroom videos score 0.15-0.40
    iou_threshold: 0.45
    input_size: 1024                        # 1024px preserves small phone details in 1440p/4K classroom video!
    device: 0
    enhance_shadows: true                   # CLAHE shadow enhancement pass for dark under-desk areas
    quantize: 16                            # FP16 (replaces deprecated 'half: true')

  # Fast cascade detector: yolo26n runs first (2ms), yolo26m confirms (8ms)
  cascade_detector:
    enabled: false                          # set true to enable cascade mode
    fast_weights: "yolo26n.pt"             # already on disk!
    fast_confidence: 0.25                  # low threshold for first pass

  pose:
    weights: "models/yolov8m-pose.pt"
    confidence: 0.5
    input_size: 640
    device: 0
    quantize: 16                            # FP16 (replaces deprecated 'half: true')

# === TENSORRT EXPORT ===
tensorrt:
  enabled: true
  fp16: true
  workspace: 4                             # GB
  export_dir: "models/"

# === DETECTION CLASSES ===
classes:
  # COCO classes (pretrained)
  person: 0
  cell_phone: 67

  # Custom classes (after fine-tuning)
  custom:
    - "person"
    - "cell_phone"
    - "calculator"
    - "cheat_sheet"
    - "earbuds"

# === BYTE TRACKER ===
tracker:
  type: bytetrack
  track_thresh: 0.5                        # min confidence to enter tracker
  high_thresh: 0.6                         # high-confidence tier for stage-1 matching
  match_thresh: 0.8                        # IoU threshold for association
  max_time_lost: 30                        # frames to keep lost tracks before removal
  min_hits: 3                              # min detections before track is confirmed

# Legacy tracking config (kept for backward compat)
tracking:
  tracker_type: "bytetrack"
  track_thresh: 0.5
  match_thresh: 0.8
  track_buffer: 30
  min_hits: 3
  frame_rate: 30

# === GAZE / HEAD POSE ESTIMATION ===
gaze:
  enabled: true
  looking_down_threshold: -30              # degrees — nose below horizontal = looking down
  head_turn_threshold: 25                  # degrees — yaw exceeds this = turning head

# === FALSE POSITIVE REDUCTION ===
false_positive_filter:
  min_consecutive_frames: 2                # lowered to 2 so fast phone moves aren't missed
  min_detection_size: 10                   # lowered to 10px so small handheld phones aren't penalized
  confidence_calibration: true             # enable geometric confidence adjustment

# === CHEATING DETECTION RULES ===
cheating_rules:
  # Phone detection
  phone_usage:
    enabled: true
    alert_after_frames: 2                  # alert after 2 consecutive frames
    confidence_threshold: 0.15             # 0.15 catches hidden/dark phones in under-desk shadows
    proximity_to_person: 220               # pixels - phone near a person = suspicious

  # Under-desk hidden phone usage (gaze + low hands behavioral rule)
  under_desk_phone:
    enabled: true
    looking_down_duration: 1.5             # seconds looking down into lap/under-desk
    confidence_threshold: 0.12

  # Calculator detection (if not allowed)
  calculator_usage:
    enabled: true
    alert_after_frames: 3
    confidence_threshold: 0.5
    allowed_sections: []                   # seat numbers where calculator is allowed

  # Posture analysis
  posture:
    enabled: true
    head_turn_threshold: 25                # degrees - head turned this much = suspicious
    head_turn_duration: 3.0                # seconds - sustained head turn
    looking_down_threshold: 30             # degrees - looking down (hidden materials?)
    looking_down_duration: 2.0
    excessive_movement_threshold: 50       # pixels - large body movement

  # Document passing
  document_passing:
    enabled: true
    hand_proximity_threshold: 100          # pixels - hands too close between students
    min_duration: 1.0                      # seconds

  # Seat violations
  seat_violations:
    enabled: true
    max_stand_duration: 5.0               # seconds - standing too long
    max_absence_duration: 30.0            # seconds - left seat

# === ALERT SETTINGS ===
alerts:
  enabled: true
  log_to_file: true
  log_dir: "logs/"
  save_snapshots: true
  snapshot_dir: "logs/snapshots/"
  cooldown: 10.0                          # seconds between same alert type per student

# === TRAINING ===
training:
  detector_model: yolo26m.pt              # YOLO26m base — NMS-free, MuSGD optimizer
  pose_model: yolov8m-pose.pt             # pose model (stable, no upgrade needed)
  epochs: 150                             # more epochs for small dataset
  batch_size: 16                          # RTX 4070 8GB handles this well
  image_size: 640
  project: runs/
  # Data pipeline
  data_yaml: "data/merged_classroom/merged.yaml"  # run scripts/merge_datasets.py first
  freeze_layers: 10                       # freeze backbone, train detection head only
  augmentation:
    mosaic: 1.0
    copy_paste: 0.15                      # copy phone bboxes across images
    mixup: 0.15
    erasing: 0.4                          # simulate occluded phones

# === DASHBOARD ===
dashboard:
  enabled: true
  port: 8080
  host: "0.0.0.0"
  stream_quality: 80                      # JPEG quality 1-100
  max_fps_display: 15                     # reduce for web display

# === PERFORMANCE ===
performance:
  max_batch_size: 1                       # per camera
  num_workers: 2
  buffer_size: 128                        # frame buffer per camera
  use_cuda_graphs: true                   # faster inference
  warmup_frames: 30                       # warm up GPU before detection
