# ClassroomGuard - Pure Exam Mode Configuration (STRICT ENFORCEMENT)
# Focus: Strict Exam Hall Monitoring - Cell Phones, Calculators, Cheat Sheets, Turning Back, Under-Desk Phones

mode: "exam"

# === CAMERA SETTINGS ===
# One entry per camera. For an IP camera use its RTSP URL, e.g.
#   source: "rtsp://viewer:PASSWORD@10.0.5.31:554/Streaming/Channels/101"   (Hikvision main stream)
# A video file path or a webcam index (0) also works for testing.
# backend_camera_id = the "Camera ID" you entered when adding the camera in the web app.
cameras:
  - id: 0
    name: "Exam Hall 306-B Desk Cam"
    backend_camera_id: "cam-001"           # Camera ID from the web app (Cameras page)
    source: "sample_videos/306-B-5.mp4"
    resolution: [1920, 1080]
    fps: 30
  - id: 1
    name: "Exam Hall 306-B Main Cam"
    backend_camera_id: "cam-002"           # Camera ID from the web app (Cameras page)
    source: "sample_videos/306-B.mp4"
    resolution: [1920, 1080]
    fps: 30

# === MODEL SETTINGS ===
models:
  detection:
    weights: "models/exam_detector.pt"      # cell_phone + calculator, trained by training/train_exam_detector.py
    fallback_weights: "models/yolo26m_custom.pt"
    confidence: 0.10                         # pre-filter only; per-class thresholds below decide
    class_confidence:                        # max-F1 thresholds picked on the val split (models/exam_detector.eval.json)
      cell_phone: 0.34                       # val max-F1; on real footage lower values flag pens / desk tape
      calculator: 0.59
    iou_threshold: 0.45
    input_size: 1280                         # trained at 1280: phones are ~20-30px in CCTV frames
    device: 0
    enhance_shadows: false                   # second CLAHE pass doubles inference cost; model trained with colour jitter

  pose:                                      # people (boxes + wrists) come from the pose model
    weights: "models/yolov8m-pose.pt"
    confidence: 0.5
    input_size: 960                          # 640 misses back-row students in a full hall
    device: 0

# === CHEATING RULES (STRICT EXAM ENFORCEMENT) ===
cheating_rules:
  # Cell Phone Prohibition
  phone_usage:
    enabled: true
    alert_after_seconds: 1.0                # phone must stay with the student this long
    grace_seconds: 1.0                      # brief occlusions do not reset the timer
    proximity_to_person: 220                # px around the student box
    hand_radius_scale: 0.6                  # "in hand" = within 0.6 x shoulder width of a wrist (HIGH)

  # Under-Desk Hidden Phone (Gaze + Low Hands)
  under_desk_phone:
    enabled: true
    looking_down_duration: 1.5              # 1.5s looking down into lap/under desk
    confidence_threshold: 0.12

  # Calculator Usage Prohibition
  calculator_usage:
    enabled: true
    allowed: false                          # set true for exams where calculators are permitted
    alert_after_seconds: 1.5
    grace_seconds: 1.0
    proximity_to_person: 220
    hand_radius_scale: 0.6

  # Posture & Head Turn (Turning Back to Copy)
  # Head-turn / looking-down cues: off by default. On fixed overhead cameras they fire on normal
  # exam behaviour (writing, facing the invigilator); enable only after per-camera calibration.
  posture:
    enabled: false
    head_turn_threshold: 25                 # 25 deg head turn
    head_turn_duration: 1.5                 # Alert after 1.5s head turn
    looking_down_threshold: 30              # Looking down into lap/sheets
    looking_down_duration: 1.5

  # Document / Sheet Passing
  document_passing:
    enabled: true
    hand_proximity_threshold: 100           # 100px hands close between students
    min_duration: 0.8                       # 0.8s hand proximity

# === FALSE POSITIVE FILTER ===
false_positive_filter:
  min_consecutive_frames: 2                 # Fast alert trigger for exam room
  min_detection_size: 10                    # 10px min size (does not penalize phones/calculators)
  confidence_calibration: true

# === ALERTS & DASHBOARD ===
alerts:
  enabled: true
  cooldown: 30.0                            # seconds before the same student is re-alerted for the same cue
  object_cooldown: 120.0                    # phone/calculator: one alert per student or desk every 2 minutes

dashboard:
  enabled: true
  port: 8080
  host: "0.0.0.0"
